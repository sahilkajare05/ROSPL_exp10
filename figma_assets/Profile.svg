<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Background Frame -->
  <rect width="390" height="844" rx="32" fill="#F8FAFC"/>

  <!-- Top bar -->
  <text x="28" y="65" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A">Student Profile</text>

  <!-- Avatar Circle -->
  <circle cx="195" cy="160" r="54" fill="url(#avatarGrad)" stroke="#C7D2FE" stroke-width="2"/>
  <text x="195" y="174" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#4F46E5">SK</text>

  <!-- Student Name and Department -->
  <text x="195" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#0F172A">Sahil Kajare</text>
  <text x="195" y="274" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748B">BE Information Technology • Sem VII</text>
  <text x="195" y="294" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#4F46E5">A. P. Shah Institute of Technology</text>

  <!-- Info Cards -->
  <!-- Student ID -->
  <rect x="28" y="325" width="334" height="62" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="48" y="350" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748B">Student ID / Roll No</text>
  <text x="48" y="372" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A">23104000</text>
  <text x="342" y="362" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#10B981">● Active</text>

  <!-- Monthly Allowance / Budget Limit -->
  <rect x="28" y="402" width="334" height="62" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="48" y="427" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748B">Monthly Budget Target</text>
  <text x="48" y="449" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A">₹5,000 / month</text>
  <text x="342" y="439" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#4F46E5">UPI / Cash</text>

  <!-- Academic Lab Details -->
  <rect x="28" y="479" width="334" height="62" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="48" y="504" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748B">Academic Practical</text>
  <text x="48" y="526" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A">ROSPL — Experiment No. 10</text>

  <!-- Navigation Action Button -->
  <rect x="28" y="585" width="334" height="52" rx="14" fill="url(#primaryGrad)"/>
  <text x="195" y="618" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">BACK TO DASHBOARD</text>

  <text x="195" y="780" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94A3B8">FinWise Profile • User Preferences</text>
</svg>